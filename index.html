from pathlib import Path

html = """<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Monitoring Kebakaran</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#020b18;color:#fff;font-family:Segoe UI}
.wrapper{display:grid;grid-template-columns:110px 1fr;min-height:100vh}
.sidebar{border-right:1px solid #00bfff;padding:10px;background:#031126}
.logo,.menubox,.bottom{border:1px solid #00bfff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 0 10px #00bfff55}
.main{padding:10px}
.header{display:flex;justify-content:space-between;border:1px solid #00bfff;border-radius:10px;padding:15px;box-shadow:0 0 10px #00bfff55}
.title{font-size:38px;font-weight:bold}.title span{color:#ff3d3d}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.card,.panel{background:#04152f;border:1px solid #00bfff;border-radius:10px;padding:12px;box-shadow:0 0 10px #00bfff44}
.card h2{font-size:40px;margin:0}
.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.panel h3{margin-top:0;color:#52d7ff}
.tabs button{margin-right:8px;padding:8px 12px}
.map{height:280px;background:#071c3d;border-radius:8px;display:flex;align-items:center;justify-content:center}
@media(max-width:1000px){.cards,.grid{grid-template-columns:1fr} .wrapper{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrapper">
<div class="sidebar">
<div class="logo">DKI<br>Sehat</div>
<div class="menubox">🔥<br>Kejadian</div>
<div class="menubox">🏠<br>Dampak</div>
<div class="menubox">👥</div>
<div class="bottom">➕ Pasien</div>
</div>
<div class="main">
<div class="header">
<div>
<div class="title">SMART <span>MONITORING KEBAKARAN</span></div>
<div>Pusat Krisis dan Kegawatdaruratan Kesehatan Daerah</div>
</div>
<div class="tabs">
<button onclick="showData('kem')">Kemayoran</button>
<button onclick="showData('joh')">Johar Baru</button>
</div>
</div>

<div id="content"></div>

</div></div>

<script>
const data={
kem:{
rumah:250,pengungsi:678,pasien:253,
gender:[124,129],
diag:{labels:['Hipertensi','Headache','Nasofaringitis','Panic Disorder','Dispnea'],data:[46,24,19,5,4]},
upaya:['Mensiagakan Tenaga Kesehatan 24 Jam','Mensiagakan unit Ambulans 24 Jam','Memberikan pelayanan Sub Klaster Kesehatan','Melakukan Pemantauan dan Pelaporan Berkala','RS Rujukan: RSUD Kemayoran, RSUD Tarakan']
},
joh:{
rumah:36,pengungsi:158,pasien:72,
gender:[27,45],
diag:{labels:['Hipertensi','Headache','Nasofaringitis Akut'],data:[15,16,1]},
upaya:['Mensiagakan Tenaga Kesehatan 24 Jam','Mensiagakan unit Ambulans 24 Jam','Memberikan pelayanan Sub Klaster Kesehatan','Melakukan Pemantauan dan Pelaporan Berkala']
}
};

function render(key){
const d=data[key];
document.getElementById('content').innerHTML=`
<div class="cards">
<div class="card"><h2>1</h2>Kejadian</div>
<div class="card"><h2>${d.rumah}</h2>Rumah Terdampak</div>
<div class="card"><h2>${d.pengungsi}</h2>Pengungsi</div>
<div class="card"><h2>${d.pasien}</h2>Total Pasien</div>
</div>
<div class="grid">
<div class="panel"><h3>Peta Lokasi Kebakaran</h3><div class="map">AREA KEBAKARAN</div></div>
<div class="panel"><h3>Data Pasien Berdasarkan Jenis Kelamin</h3><canvas id="gender"></canvas></div>
<div class="panel"><h3>Ringkasan</h3><p>Dashboard Pos Kesehatan</p></div>
<div class="panel"><h3>Sebaran Diagnosa Pos Kesehatan</h3><canvas id="diag"></canvas></div>
<div class="panel"><h3>Upaya Kesehatan yang Dilakukan</h3><ul>${d.upaya.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
</div>`;

new Chart(document.getElementById('gender'),{type:'doughnut',data:{labels:['Laki-laki','Perempuan'],datasets:[{data:d.gender}]}});
new Chart(document.getElementById('diag'),{type:'pie',data:{labels:d.diag.labels,datasets:[{data:d.diag.data}]}});
}
function showData(k){render(k)}
render('kem');
</script>
</body>
</html>"""
p="/mnt/data/index_dashboard_kebakaran.html"
Path(p).write_text(html,encoding="utf-8")
print(p)
